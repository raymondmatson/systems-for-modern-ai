schema_version: 1.0.0
configuration_id: meta-24576-h100-roce
scenarios:
- id: baseline-normal-operation
  name: Baseline / normal operation
  description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  default: true
  scenario_types:
  - baseline
  effects: []
- id: roce-congestion
  name: RoCE congestion
  description: Congestion on the RoCE fabric highlights topology and transport sensitivity.
  default: false
  scenario_types:
  - performance_bottleneck
  effects:
  - target:
      type: entity
      id: meta-roce-switches
    state:
      health: degraded
      emphasis: congestion
      note: Congestion on the RoCE fabric highlights topology and transport sensitivity.
- id: checkpoint-storage-burst
  name: Checkpoint / storage burst
  description: A synchronized checkpoint burst emphasizes the physical compute-to-storage path and storage service boundary
    while the cluster topology remains fixed.
  default: false
  scenario_types:
  - performance_bottleneck
  effects:
  - target:
      type: connection
      id: meta-storage-path
    state:
      operational: active
      emphasis: checkpoint_io
      note: Checkpoint traffic is emphasized on the storage path.
  - target:
      type: entity
      id: meta-yv3
    state:
      health: healthy
      emphasis: high_io
      note: YV3 storage remains healthy under elevated checkpoint traffic.

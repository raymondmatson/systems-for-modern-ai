schema_version: 1.0.0
configuration_id: condor-galaxy-3-64-cs3
scenarios:
- id: baseline-normal-operation
  name: Baseline / normal operation
  description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  default: true
  scenario_types:
  - baseline
  effects: []
- id: swarmx-degradation
  name: SwarmX degradation
  description: A degraded collective fabric highlights dependency on broadcast/reduction infrastructure.
  default: false
  scenario_types:
  - failure_degradation
  effects:
  - target:
      type: entity
      id: cg3-swarmx
    state:
      health: degraded
      emphasis: collective_path
      note: A degraded collective fabric highlights dependency on broadcast/reduction infrastructure.
- id: memoryx-weight-stream-pressure
  name: MemoryX / weight-stream pressure
  description: Pressure on the external model-memory path emphasizes the MemoryX-to-CS-3 weight stream while the wafer-scale
    compute structure remains fixed.
  default: false
  scenario_types:
  - performance_bottleneck
  effects:
  - target:
      type: connection
      id: cg3-weight-stream
    state:
      operational: active
      emphasis: weight_stream_pressure
      note: Model-weight streaming becomes the emphasized data path.
  - target:
      type: entity
      id: cg3-memoryx
    state:
      health: healthy
      emphasis: memory_pressure
      note: MemoryX remains available while model-memory demand is elevated.

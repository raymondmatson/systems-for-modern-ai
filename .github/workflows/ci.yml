name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: python -m pip install -r requirements.txt
      # The handoff lockfile could not be transitively resolved in the offline
      # assembly environment. Switch to `npm ci` after the first network-enabled
      # install commits a complete lockfile.
      - run: npm install --no-audit --no-fund
      - run: npm run content:generate
      - run: npm run content:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

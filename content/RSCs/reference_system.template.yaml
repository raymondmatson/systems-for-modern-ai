# Reference-System configuration template — schema 1.4.0.
# entity_type uses the controlled vocabulary in reference_system.schema.json / README.md.
# Tier 5 is one Internal Detail navigation band and may contain multiple same-tier containment levels.
# Reusable reference-system configuration template.
# Copy and replace values; remove branches that do not apply to the system being modeled.
# Do not rely on YAML anchors/tags. Keep the document JSON-compatible.
#
# Inventory rules:
# - For status: existing, category/item must exactly match Organizational_Content_Inventory.md.
# - Use status: proposed_addition only for a genuine inventory gap; include inventory.note explaining the gap.
# - Do not add a component simply because it exists in the inventory; include it only when it is relevant and supported.
#
# Entity identity rules:
# - id is configuration-local physical/model identity.
# - entity_type defines what the entity is and which structural/functional behavior applies.
# - inventory is organizational/documentation classification and does not control behavior.
# - product_identity is optional metadata for identifiable real products across configurations.
# - Allowed product_identity fields: manufacturer, product_family, model, variant, generation, architecture, codename.
# - Include only useful, source-supported fields. Omit a block/field instead of writing unknown/N/A/TBD/proprietary.
# - Do not attach one singular product_identity to a heterogeneous aggregate containing multiple product models.
#
# Evidence rules:
# - documented: explicitly supported by a listed source.
# - inferred: a reasonable architectural inference; explain the inference in evidence.note.
# - simplified: known architecture represented at reduced detail; explain what was simplified.
# - unknown/proprietary: represent as black_box or omit; do not invent internals.

schema_version: 1.4.0
reference_system:
  id: example-system
  name: Example Reference System
  vendor_operator: Example organization
  planning_status: worth_considering_later
  introduction:
    date_or_year: 2026
    lifecycle: emerging
  summary: Replace with a concise system-level description.
  learning_value:
  - Replace with a learning goal
  source_ids:
  - example-source

sources:
- id: example-source
  title: Primary architecture source
  publisher: Example organization
  url: https://example.invalid/architecture
  accessed: '2026-08-22'
  note: Replace with a primary or otherwise authoritative source.

configurations:
- id: example-baseline
  name: Example baseline configuration
  configuration_status: baseline
  default_scenario:
    id: baseline-normal-operation
    name: Baseline / normal operation
    description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  scenario_catalog:
    path: scenarios/example-baseline.yaml
    default_scenario_id: baseline-normal-operation
  scope_notes: Define what this configuration models and intentionally omits.
  modeling_notes:
  - Use documented facts where possible; black-box or omit unavailable details.
  - The rack/tray structure below is illustrative. Remove or replace it when the real system uses a different hierarchy.
  source_ids:
  - example-source
  hierarchy:
    root:
      id: example-root
      name: Example system root
      entity_type: compute_cluster
      explore_tier: 1
      inventory:
        category: Physical infrastructure hierarchy
        item: Compute clusters
        status: existing
      representation: explicit
      evidence:
        status: documented
        source_ids:
        - example-source
        note: Replace with evidence for the system-level boundary.
      properties: {}
      children:
      - id: example-rack
        name: Example rack
        entity_type: rack
        explore_tier: 2
        inventory:
          category: Physical infrastructure hierarchy
          item: Racks
          status: existing
        representation: explicit
        evidence:
          status: simplified
          source_ids:
          - example-source
          note: Replace with the documented rack or Tier-2 grouping; this example uses a rack for illustration.
        properties: {}
        children:
        - id: example-compute-tray
          name: Example compute tray
          entity_type: compute_tray
          explore_tier: 3
          inventory:
            category: Physical infrastructure hierarchy
            item: Compute trays / accelerator trays
            status: existing
          representation: aggregate
          evidence:
            status: simplified
            source_ids:
            - example-source
            note: Include a compute/accelerator tray only when it is a real, meaningful assembly in the system.
          properties: {}
          children:
          - id: example-accelerator
            name: Example accelerator
            entity_type: ai_accelerator
            product_identity:
              manufacturer: Example Silicon Company
              product_family: Example Accelerator
              model: Example X1
              architecture: Example Architecture
            explore_tier: 4
            inventory:
              category: Server-level hardware
              item: Other AI accelerators
              status: existing
            representation: aggregate
            evidence:
              status: documented
              source_ids:
              - example-source
              note: Replace with the actual accelerator type and evidence.
            properties: {}
            children:
            - id: example-compute-core
              name: Example compute cores
              entity_type: compute_core
              explore_tier: 5
              inventory:
                category: Accelerator internals
                item: Compute cores
                status: existing
              representation: aggregate
              evidence:
                status: simplified
                source_ids:
                - example-source
                note: Expand accelerator internals only when they materially aid learning and are supportable.
              properties: {}
              children: []
        - id: example-switch-tray
          name: Example switch tray
          entity_type: switch_tray
          explore_tier: 3
          inventory:
            category: Physical infrastructure hierarchy
            item: Switch trays / fabric switch trays
            status: existing
          representation: black_box
          evidence:
            status: unknown
            source_ids:
            - example-source
            note: This example demonstrates a known assembly whose internal implementation is unavailable.
          properties: {}
          children: []
  connections:
  - id: example-scaleup-link
    name: Example scale-up connectivity
    relationship_type: physical_connectivity
    endpoints:
    - example-accelerator
    - example-switch-tray
    directionality: undirected
    inventory:
      category: Local server interconnects
      item: UALink / emerging scale-up fabrics
      status: existing
    evidence:
      status: simplified
      source_ids:
      - example-source
      note: Replace with the actual documented interconnect; do not assume UALink for systems that use another fabric.
    properties: {}
  functional_groups:
  - id: example-scaleup-domain
    name: Example scale-up domain
    category: scale_up_domain
    member_ids:
    - example-accelerator
    - example-switch-tray
    evidence:
      status: simplified
      source_ids:
      - example-source
      note: Replace with a real functional grouping when one is meaningful.
  concept_links:
  - concept_id: scale-up-versus-scale-out
    role: illustrates
    target:
      type: connection
      id: example-scaleup-link
    note: Example canonical occurrence link from physical architecture to a global Concept.
  unknowns:
  - description: Example switch-tray internals are intentionally unavailable in this template.
    treatment: black_box
    affected_entity_ids:
    - example-switch-tray

# 1.4.0 authoring examples (optional; apply only when supported)
# An ordinary semantic entity may reference an exact Product Definition:
# product_ref:
#   id: nvidia-connectx-7
#   revision: 1
#
# An enclosing entity may carry noninteractive physical-orientation depictions:
# anatomy:
#   - id: psu-bank
#     label: Power-supply assembly
#     description: Visible power-delivery hardware known to exist in this enclosure.
#     inventory:
#       category: Server-level hardware
#       item: Power supplies
#       status: existing
#     evidence:
#       status: documented
#       source_ids: [source-id]
#       note: Exact placement is not asserted.
#     depiction_kind: power
#     placement_basis: schematic
#     count:
#       value: 6
#       basis: documented_fixed

            inventory:
              category: Server-level hardware
              item: Baseboard management controllers
              status: existing
            evidence:
              status: documented
              source_ids:
              - meta-genai
              - meta-grandteton
              note: The chassis integrates control interfaces; controller SKU and physical placement are not asserted.
            depiction_kind: management
            placement_basis: schematic
          - id: meta-grand-teton-fabric-support
            label: Integrated fabric interface support
            inventory:
              category: Server-level hardware
              item: NICs
              status: existing
            evidence:
              status: documented
              source_ids:

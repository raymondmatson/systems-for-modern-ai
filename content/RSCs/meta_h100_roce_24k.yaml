        item: Compute clusters
        status: existing
      representation: explicit
      evidence:
        status: documented
        source_ids:
        - meta-genai
        note: Cluster scale is 24,576 H100 GPUs; this file models the RoCE variant.
      properties:
        h100_gpu_count:

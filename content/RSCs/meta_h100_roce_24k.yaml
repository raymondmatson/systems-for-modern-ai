schema_version: 1.4.0
reference_system:
  id: meta-h100-roce-24k
  name: Meta 24K H100 RoCE Training Cluster
  vendor_operator: Meta
  planning_status: recommended_initial
  introduction:
    date_or_year: 2024
    lifecycle: current
  summary: Production-scale H100 training cluster that contrasts Ethernet/RoCE scale-out with InfiniBand alternatives 
    and exposes storage, scheduling, and operational concerns at very large scale.
  learning_value:
  - Real production AI training deployment
  - RoCE/Ethernet accelerator fabric
  - Storage and topology-aware operations
  source_ids:
  - meta-genai
  - meta-grandteton
sources:
- id: meta-genai
  title: Building Meta's GenAI Infrastructure
  publisher: Meta Engineering
  url: https://engineering.fb.com/2024/03/12/data-center-engineering/building-metas-genai-infrastructure/
  accessed: '2026-08-19'
- id: meta-grandteton
  title: Meta's open AI hardware vision
  publisher: Meta Engineering
  url: https://engineering.fb.com/2024/10/15/data-infrastructure/metas-open-ai-hardware-vision/
  accessed: '2026-08-19'
- id: meta-wedge400-spec
  title: Wedge 400 Design Specification
  publisher: Open Compute Project
  url: https://www.opencompute.org/documents/wedge400-ocp-specification-v0-3-pdf
  accessed: '2026-09-07'
- id: meta-ocp-networking
  title: 'OCP Summit 2021: Open networking hardware lays the groundwork for the metaverse'
  publisher: Meta
  url: https://engineering.fb.com/2021/11/09/data-center-engineering/ocp-summit-2021/
  accessed: '2026-09-07'
- id: ocp-minipack2
  title: Minipack2 Generic OCP Specification
  publisher: Open Compute Project
  url: https://www.opencompute.org/documents/minipack2-generic-ocp-specification-rev1-0-pdf
  accessed: '2026-09-07'
- id: arista-7800r3
  title: Arista 7800R3 Series Data Sheet
  publisher: Arista Networks
  url: https://www.arista.com/assets/data/pdf/Datasheets/7800R3-Data-Sheet.pdf
  accessed: '2026-09-07'
- id: nv-h100-gpu
  title: NVIDIA H100 Tensor Core GPU
  publisher: NVIDIA
  url: https://www.nvidia.com/en-us/data-center/h100/
  accessed: '2026-09-07'
- id: nvme-ssd-architecture
  title: NVM Express — NVMe Technology Overview
  publisher: NVM Express

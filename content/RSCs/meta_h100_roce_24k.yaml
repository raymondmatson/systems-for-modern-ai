schema_version: 1.3.0
reference_system:
  id: meta-h100-roce-24k
  name: Meta 24K H100 RoCE Training Cluster
  vendor_operator: Meta
  planning_status: recommended_initial
  introduction:
    date_or_year: 2024
    lifecycle: current
  summary: Production-scale H100 training cluster that contrasts Ethernet/RoCE scale-out with InfiniBand alternatives and exposes storage, scheduling, and operational concerns at very large scale.
  learning_value:
  - Real production AI training deployment
  - RoCE/Ethernet accelerator fabric
  - Storage and topology-aware operations
  source_ids:
  - meta-genai
  - meta-grandteton
sources:
- id: meta-genai
  title: Building Meta's GenAI Infrastructure
  publisher: Meta Engineering
  url: https://engineering.fb.com/2024/03/12/data-center-engineering/building-metas-genai-infrastructure/
  accessed: '2026-08-19'
- id: meta-grandteton
  title: Meta's open AI hardware vision
  publisher: Meta Engineering
  url: https://engineering.fb.com/2024/10/15/data-infrastructure/metas-open-ai-hardware-vision/
  accessed: '2026-08-19'
configurations:
- id: meta-24576-h100-roce
  name: Meta 24,576-H100 RoCE training cluster
  configuration_status: historical
  default_scenario:
    id: baseline-normal-operation
    name: Baseline / normal operation
    description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  scope_notes: Models the RoCE cluster variant described by Meta, emphasizing the production Ethernet/RDMA fabric, Grand Teton compute platform, and flash-backed storage infrastructure.
  modeling_notes:
  - Grand Teton internals and rack counts remain black-box/aggregate where Meta does not provide enough H100-specific layout detail in the selected source.
  source_ids:
  - meta-genai
  - meta-grandteton

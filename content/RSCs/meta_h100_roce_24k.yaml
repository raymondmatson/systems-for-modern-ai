            children: []
            product_ref:
              id: nvidia-h100
              revision: 1
            anatomy:
            - id: meta-h100-gpu-package
              label: H100 GPU package / compute silicon
              inventory:
                category: Accelerator internals
                item: GPU / accelerator dies
                status: existing
              evidence:
                status: documented
                source_ids:
                - nv-h100-gpu

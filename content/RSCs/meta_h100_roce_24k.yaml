  default_scenario:
    id: baseline-normal-operation
    name: Baseline / normal operation
    description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  scope_notes: Models the RoCE cluster variant described by Meta, emphasizing the production Ethernet/RDMA fabric, Grand
    Teton compute platform, and flash-backed storage infrastructure.
  modeling_notes:
  - Grand Teton internals and rack counts remain black-box/aggregate where Meta does not provide enough H100-specific 
    layout detail in the selected source.
  - 'Meta storage service context: the physical YV3 tier is exposed through a Tectonic-backed FUSE path; software storage
    abstractions are explanatory context, not physical child entities.'
  source_ids:
  - meta-genai
  - meta-grandteton

        entity_type: network_switch
        explore_tier: 3
        inventory:
          category: Physical infrastructure hierarchy
          item: Network switches
          status: existing
        representation: aggregate
        evidence:
          status: documented
          source_ids:
          - meta-genai
          note: RoCE fabric uses Arista 7800 with Wedge400 and Minipack2 OCP rack switches.
        properties:
          switch_families:
            status: known
            value:
              form: text
              text: Arista 7800, Wedge400, Minipack2
        children:
        - id: meta-arista-7800
          name: Arista 7800 spine switches
          entity_type: network_switch
          explore_tier: 4
          inventory:
            category: Physical infrastructure hierarchy
            item: Network switches
            status: existing
          representation: aggregate
          evidence:
            status: documented
            source_ids:
            - meta-genai
            note: Meta identifies Arista 7800 switches as part of the RoCE fabric; exact deployment count/topology is not
              asserted.
          properties: {}
          children: []
          product_identity:
            manufacturer: Arista
            product_family: 7800 Series
        - id: meta-wedge400
          name: Wedge400 rack switches
          entity_type: network_switch
          explore_tier: 4
          inventory:
            category: Physical infrastructure hierarchy
            item: Network switches
            status: existing
          representation: aggregate
          evidence:
            status: documented
            source_ids:
            - meta-genai
            note: Wedge400 OCP rack switches are part of the RoCE fabric.
          properties: {}
          children: []
          product_identity:
            manufacturer: Meta
            model: Wedge400
        - id: meta-minipack2
          name: Minipack2 rack switches
          entity_type: network_switch
          explore_tier: 4
          inventory:
            category: Physical infrastructure hierarchy
            item: Network switches
            status: existing
          representation: aggregate
          evidence:
            status: documented
            source_ids:
            - meta-genai
            note: Minipack2 OCP rack switches are part of the RoCE fabric.
          properties: {}
          children: []
          product_identity:
            manufacturer: Meta
            model: Minipack2
      - id: meta-storage-racks
        name: Storage infrastructure
        entity_type: storage_group
        explore_tier: 2
        inventory:
          category: Storage
          item: Distributed storage
          status: existing
        representation: aggregate
        evidence:
          status: documented
          source_ids:
          - meta-genai
          note: Physical YV3 storage supports training data and checkpointing. Meta exposes this through a FUSE API backed
            by Tectonic and uses Hammerspace in the broader storage environment; software services are explanatory context
            rather than physical children.
        properties: {}
        children:
        - id: meta-yv3
          name: YV3 Sierra Point storage servers
          entity_type: storage_server
          product_identity:
            manufacturer: Meta
            model: YV3 Sierra Point
          explore_tier: 3
          inventory:
            category: Physical infrastructure hierarchy
            item: Storage servers
            status: existing
          representation: aggregate
          evidence:
            status: documented
            source_ids:
            - meta-genai
            note: Both storage deployments use the YV3 Sierra Point server platform.
          properties: {}
          children:
          - id: meta-e1s
            name: High-capacity E1.S SSDs
            entity_type: local_storage
            explore_tier: 4
            inventory:
              category: Server-level hardware
              item: NVMe SSDs
              status: existing
            representation: aggregate
            evidence:
              status: documented
              source_ids:
              - meta-genai
              note: Storage servers use high-capacity E1.S SSDs.
            properties: {}
            children: []

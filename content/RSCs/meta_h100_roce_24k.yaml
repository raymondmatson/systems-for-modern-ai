            name: High-capacity E1.S SSDs
            entity_type: local_storage
            explore_tier: 4
            inventory:
              category: Server-level hardware
              item: NVMe SSDs
              status: existing
            representation: aggregate
            evidence:
              status: documented
              source_ids:
              - meta-genai
              note: Storage servers use high-capacity E1.S SSDs.
            properties: {}
            children: []

            status: existing
          representation: black_box
          evidence:
            status: documented
            source_ids:
            - meta-genai
            - meta-grandteton
            note: Grand Teton integrates power, control, compute and fabric into a chassis; exact H100-per-chassis layout is not asserted here.
          properties: {}
          children:

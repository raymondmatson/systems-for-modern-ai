schema_version: 1.4.0
reference_system:
  id: meta-h100-roce-24k
  name: Meta 24K H100 RoCE Training Cluster
  vendor_operator: Meta
  planning_status: recommended_initial
  introduction:
    date_or_year: 2024
    lifecycle: current
  summary: Production-scale H100 training cluster that contrasts Ethernet/RoCE scale-out with InfiniBand alternatives and
    exposes storage, scheduling, and operational concerns at very large scale.
  learning_value:
  - Real production AI training deployment
  - RoCE/Ethernet accelerator fabric
  - Storage and topology-aware operations
  source_ids:
  - meta-genai
  - meta-grandteton
sources:
- id: meta-genai
  title: Building Meta's GenAI Infrastructure
  publisher: Meta Engineering
  url: https://engineering.fb.com/2024/03/12/data-center-engineering/building-metas-genai-infrastructure/
  accessed: '2026-08-19'
- id: meta-grandteton
  title: Meta's open AI hardware vision
  publisher: Meta Engineering
  url: https://engineering.fb.com/2024/10/15/data-infrastructure/metas-open-ai-hardware-vision/
  accessed: '2026-08-19'
configurations:
- id: meta-24576-h100-roce
  name: Meta 24,576-H100 RoCE training cluster
  configuration_status: historical
  default_scenario:
    id: baseline-normal-operation
    name: Baseline / normal operation
    description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  scope_notes: Models the RoCE cluster variant described by Meta, emphasizing the production Ethernet/RDMA fabric, Grand Teton
    compute platform, and flash-backed storage infrastructure.
  modeling_notes:
  - Grand Teton internals and rack counts remain black-box/aggregate where Meta does not provide enough H100-specific layout
    detail in the selected source.
  - 'Meta storage service context: the physical YV3 tier is exposed through a Tectonic-backed FUSE path; software storage
    abstractions are explanatory context, not physical child entities.'
  source_ids:
  - meta-genai
  - meta-grandteton
  hierarchy:
    root:
      id: meta-h100-roce
      name: Meta 24K H100 RoCE training cluster
      entity_type: compute_cluster
      explore_tier: 1
      inventory:
        category: Physical infrastructure hierarchy
        item: Compute clusters
        status: existing
      representation: explicit
      evidence:
        status: documented
        source_ids:
        - meta-genai
        note: Cluster scale is 24,576 H100 GPUs; this file models the RoCE variant.
      properties:
        h100_gpu_count:
          status: known
          value:
            form: scalar
            number: 24576
            approximate: false
          basis: advertised
        endpoint_speed_gbps:
          status: known
          value:
            form: scalar
            number: 400
            approximate: false
            unit: Gb/s
          basis: advertised
          scope: per_link
      children:
      - id: meta-compute-racks
        name: Compute racks
        entity_type: rack_group
        explore_tier: 2
        inventory:
          category: Physical infrastructure hierarchy
          item: Racks
          status: existing
        representation: aggregate
        evidence:
          status: simplified
          source_ids:
          - meta-genai
          note: Cluster uses Open Rack and Grand Teton; rack count is not asserted.
        properties:
          rack_standard:
            status: known
            value:
              form: text
              text: Meta Open Rack
        children:
        - id: meta-grand-teton
          name: Grand Teton GPU platform
          entity_type: compute_node
          explore_tier: 3
          inventory:
            category: Physical infrastructure hierarchy
            item: Servers / compute nodes
            status: existing
          representation: black_box
          evidence:
            status: documented
            source_ids:
            - meta-genai
            - meta-grandteton
            note: Grand Teton remains a black-box chassis in this configuration. Meta documents integrated power, control,
              compute, and fabric interfaces but the selected cluster source does not support a DGX-like internal decomposition
              or exact H100 placement.
          properties: {}
          children:
          - id: meta-h100-gpus
            name: H100 GPUs
            entity_type: gpu
            explore_tier: 4
            inventory:
              category: Server-level hardware
              item: GPUs
              status: existing
            representation: aggregate
            evidence:
              status: documented
              source_ids:
              - meta-genai
              note: H100 accelerators are the cluster compute devices; per-chassis quantity is intentionally unknown here.
            properties: {}
            children: []
            product_ref:
              id: nvidia-h100
              revision: 1
          product_ref:
            id: meta-grand-teton
            revision: 1
          anatomy:
          - id: meta-grand-teton-power-support
            label: Integrated power support
            inventory:
              category: Server-level hardware
              item: Power supplies
              status: existing
            evidence:
              status: documented
              source_ids:
              - meta-genai
              - meta-grandteton
              note: Meta describes Grand Teton as integrating power with compute/control/fabric interfaces; exact PSU count/model/placement
                is not asserted.
            depiction_kind: power
            placement_basis: schematic
          - id: meta-grand-teton-control-support
            label: Integrated control support
            inventory:
              category: Server-level hardware
              item: Baseboard management controllers
              status: existing
            evidence:
              status: documented
              source_ids:
              - meta-genai
              - meta-grandteton
              note: The chassis integrates control interfaces; controller SKU and physical placement are not asserted.
            depiction_kind: management
            placement_basis: schematic
          - id: meta-grand-teton-fabric-support
            label: Integrated fabric interface support
            inventory:
              category: Server-level hardware
              item: NICs
              status: existing
            evidence:
              status: documented
              source_ids:
              - meta-genai
              - meta-grandteton
              note: Grand Teton integrates fabric interfaces as part of the monolithic system design; exact adapter count/topology
                is not modeled here.
            depiction_kind: network
            placement_basis: schematic
      - id: meta-roce-switches

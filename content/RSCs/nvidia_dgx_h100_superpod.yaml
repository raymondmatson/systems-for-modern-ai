schema_version: 1.4.0
reference_system:
  id: nvidia-dgx-h100-superpod
  name: NVIDIA DGX H100 SuperPOD
  vendor_operator: NVIDIA
  planning_status: recommended_initial
  introduction:
    date_or_year: 2022
    lifecycle: mature
  summary: Server-centered Hopper GPU cluster reference architecture using DGX H100 nodes, NVLink/NVSwitch scale-up, InfiniBand
    scale-out, management fabrics, and certified storage.
  learning_value:
  - Baseline server-centered GPU cluster
  - Clear scale-up versus scale-out boundary
  - Rail-optimized InfiniBand fabric
  source_ids:
  - nv-h100-ra
  - nv-h100-fabrics
  - nv-dgx-h100
sources:
- id: nv-h100-ra
  title: DGX SuperPOD Architecture
  publisher: NVIDIA
  url: https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/dgx-superpod-architecture.html
  accessed: '2026-08-19'
- id: nv-h100-fabrics
  title: Network Fabrics — DGX SuperPOD
  publisher: NVIDIA
  url: https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/network-fabrics.html
  accessed: '2026-08-19'
- id: nv-dgx-h100
  title: Introduction to NVIDIA DGX H100/H200 Systems
  publisher: NVIDIA
  url: https://docs.nvidia.com/dgx/dgxh100-user-guide/introduction-to-dgxh100.html
  accessed: '2026-08-19'
configurations:
- id: h100-superpod-4su-reference
  name: H100 SuperPOD 4-SU reference architecture
  configuration_status: baseline
  default_scenario:
    id: baseline-normal-operation
    name: Baseline / normal operation
    description: Normal/baseline operation with no deliberately injected fault or bottleneck.
  scope_notes: Initial educational model of the documented H100 SuperPOD reference architecture. Rack placement is intentionally
    not fixed because NVIDIA permits rack-layout variation for power/cooling constraints.
  modeling_notes:
  - Physical rack placement is simplified; the SU is modeled as the stable Tier-2 grouping.
  - Storage partner internals remain a black box.
  source_ids:
  - nv-h100-ra
  - nv-h100-fabrics
  - nv-dgx-h100

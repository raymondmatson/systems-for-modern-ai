schema_version: 1.4.0
reference_system:
  id: nvidia-dgx-h100-superpod
  name: NVIDIA DGX H100 SuperPOD
  vendor_operator: NVIDIA
  planning_status: recommended_initial
  introduction:
    date_or_year: 2022
    lifecycle: mature
  summary: Server-centered Hopper GPU cluster reference architecture using DGX H100 nodes, NVLink/NVSwitch scale-up, 
    InfiniBand scale-out, management fabrics, and certified storage.
  learning_value:
  - Baseline server-centered GPU cluster
  - Clear scale-up versus scale-out boundary
  - Rail-optimized InfiniBand fabric
  source_ids:
  - nv-h100-ra
  - nv-h100-fabrics
  - nv-dgx-h100

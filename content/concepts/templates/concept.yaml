# Canonical Concept metadata template.
# Required fields are shown uncommented. Replace example values before promotion.
# Omit unsupported optional fields instead of using TBD/unknown/N/A placeholders.

schema_version: "1.0.0"
concept_id: example-concept
name: Example Concept
concept_kind: mechanism
summary: >
  Replace this summary with a concise plain-text description suitable for
  search results, cards, previews, and tooltips.
content_file: ../content/example-concept.md

# Optional aliases: acronyms, abbreviations, and recognized alternate terminology.
